name: Workshop Studio Windows build

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'
      - name: Source checks
        run: |
          python scripts/Check-Theme.py
          python scripts/Check-Packaging.py
          python scripts/Check-Login.py
          python scripts/Check-Wiki.py
      - name: Restore, build and run self-tests
        run: |
          dotnet restore WorkshopStudio.sln
          dotnet build WorkshopStudio.sln --no-restore -c Release
          dotnet run --project tests/WorkshopStudio.SelfTest -c Release --no-build
